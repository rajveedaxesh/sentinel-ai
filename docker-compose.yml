services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////app/data/sentinelai.db
      DATA_PATH: /app/data/sample/metrics.csv
      ARTIFACT_PATH: /app/models/isolation_forest.joblib
    ports:
      - "8000:8000"
    volumes:
      - sentinel_data:/app/data
      - sentinel_models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  dashboard:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sentinel_data:
  sentinel_models: